          cat > app/src/main/java/br/com/pixbanner/MainActivity.kt <<'EOF'
          package br.com.pixbanner

          import android.Manifest
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import kotlin.random.Random

          class MainActivity : ComponentActivity() {

              private val notifPerm = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Notifier.ensureChannels(this)
                  askNotificationPermission()
                  askExactAlarmPermission()
                  setContent {
                      AppTheme {
                          Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              ConfigScreen(::schedule)
                          }
                      }
                  }
              }

              private fun askNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) notifPerm.launch(Manifest.permission.POST_NOTIFICATIONS)
              }

              private fun askExactAlarmPermission() {
                  if (Build.VERSION.SDK_INT >= 31) {
                      val am = getSystemService(AlarmManager::class.java)
                      if (!am.canScheduleExactAlarms()) {
                          runCatching {
                              startActivity(Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:$packageName")))
                          }
                      }
                  }
              }

              private fun schedule(bank: Bank, cents: Long, sender: String, masked: Boolean, delay: Long) {
                  val payload = Intent(this, AlarmReceiver::class.java).apply {
                      putExtra(AlarmReceiver.EXTRA_BANK, bank.key)
                      putExtra(AlarmReceiver.EXTRA_AMOUNT, Bank.brl(cents))
                      putExtra(AlarmReceiver.EXTRA_SENDER, sender)
                      putExtra(AlarmReceiver.EXTRA_MASKED, masked)
                  }
                  val pi = PendingIntent.getBroadcast(
                      this, 7, payload,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val am = getSystemService(AlarmManager::class.java)
                  val at = System.currentTimeMillis() + delay * 1000L
                  try {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
                  } catch (e: SecurityException) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
                  }
                  finishAndRemoveTask()
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun ConfigScreen(onSchedule: (Bank, Long, String, Boolean, Long) -> Unit) {
              var bank by remember { mutableStateOf(Bank.NUBANK) }
              var cents by remember { mutableStateOf(150000L) }
              var sender by remember { mutableStateOf("Gabriel Silva") }
              var masked by remember { mutableStateOf(true) }
              var delayText by remember { mutableStateOf("8") }
              var expanded by remember { mutableStateOf(false) }

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(22.dp),
                  verticalArrangement = Arrangement.spacedBy(10.dp)
              ) {
                  Text("Pix Banner", style = MaterialTheme.typography.headlineSmall)
                  Text(
                      "Notificação nativa com identidade do banco",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurface.copy(alpha = .55f)
                  )
                  Spacer(Modifier.height(8.dp))

                  ExposedDropdownMenuBox(expanded, { expanded = it }) {
                      OutlinedTextField(
                          value = bank.label,
                          onValueChange = {},
                          readOnly = true,
                          label = { Text("Banco") },
                          trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded) },
                          modifier = Modifier.fillMaxWidth().menuAnchor()
                      )
                      ExposedDropdownMenu(expanded, { expanded = false }) {
                          Bank.entries.forEach {
                              DropdownMenuItem(text = { Text(it.label) }, onClick = { bank = it; expanded = false })
                          }
                      }
                  }

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = Bank.brl(cents),
                          onValueChange = { v -> cents = v.filter { it.isDigit() }.take(9).toLongOrNull() ?: 0L },
                          label = { Text("Valor (R$)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.weight(1f)
                      )
                      OutlinedButton(onClick = { cents = Random.nextLong(3000, 180000) }) { Text("Aleatório") }
                  }

                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(
                          value = sender,
                          onValueChange = { sender = it },
                          label = { Text("Remetente") },
                          modifier = Modifier.weight(1f)
                      )
                      OutlinedButton(onClick = { sender = Bank.NOMES.random() }) { Text("Aleatório") }
                  }

                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text("Ocultar sobrenome", modifier = Modifier.weight(1f))
                      Switch(checked = masked, onCheckedChange = { masked = it })
                  }

                  OutlinedTextField(
                      value = delayText,
                      onValueChange = { delayText = it.filter { c -> c.isDigit() }.take(3) },
                      label = { Text("Atraso (segundos)") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(Modifier.height(4.dp))
                  Text("Prévia", style = MaterialTheme.typography.labelMedium)
                  Card(Modifier.fillMaxWidth()) {
                      Row(Modifier.padding(14.dp), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Surface(shape = MaterialTheme.shapes.medium, color = Color(bank.color), modifier = Modifier.size(46.dp)) {}
                          Column {
                              Text(bank.title, style = MaterialTheme.typography.titleSmall)
                              Text(bank.body(Bank.brl(cents), sender, masked), style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  }

                  Spacer(Modifier.height(6.dp))
                  Button(
                      onClick = { onSchedule(bank, cents, sender, masked, delayText.toLongOrNull() ?: 8L) },
                      modifier = Modifier.fillMaxWidth().height(52.dp)
                  ) { Text("Agendar e fechar o app") }

                  Text(
                      "O app encerra na hora. Mantenha \"Notificações flutuantes\" ativo nas configurações do MIUI.",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurface.copy(alpha = .5f)
                  )
              }
          }
          EOF

          echo "Projeto gerado:"
          find . -type f -not -path './.git/*' | sort

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PixBanner-apk
          path: app/build/outputs/apk/debug/*.apk