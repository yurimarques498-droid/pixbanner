          cat > app/src/main/java/br/com/pixbanner/Bank.kt <<'EOF'
          package br.com.pixbanner

          import androidx.annotation.ColorInt
          import java.text.NumberFormat
          import java.util.Locale

          enum class Bank(
              val key: String,
              val label: String,
              @ColorInt val color: Int,
              val title: String,
              val smallIcon: Int,
          ) {
              NUBANK("nubank", "Nubank", 0xFF830AD1.toInt(), "Transferência recebida", R.drawable.ic_stat_nu),
              INTER("inter", "Inter", 0xFFFF7A00.toInt(), "Pix recebido", R.drawable.ic_stat_inter),
              PICPAY("picpay", "PicPay", 0xFF11C76F.toInt(), "Pix recebido", R.drawable.ic_stat_picpay);

              val channelId: String get() = "pix_$key"
              val channelName: String get() = "Pix recebido - $label"

              fun body(amount: String, sender: String, masked: Boolean): String = when (this) {
                  NUBANK -> "Você recebeu uma transferência de R$ $amount de ${maskNubank(sender, masked)}."
                  INTER -> "Você recebeu um Pix de R$ $amount de ${maskInter(sender, masked)}"
                  PICPAY -> "Oba! Você recebeu R$ $amount de ${maskPicpay(sender, masked)} 💸"
              }

              companion object {
                  fun of(key: String?): Bank = entries.firstOrNull { it.key == key } ?: NUBANK

                  private fun parts(s: String) = s.trim().split(Regex("\\s+")).filter { it.isNotBlank() }

                  fun maskNubank(s: String, masked: Boolean): String {
                      val p = parts(s)
                      if (!masked || p.size < 2) return p.joinToString(" ")
                      return p.first() + " " + "*".repeat(p.last().length)
                  }

                  fun maskInter(s: String, masked: Boolean): String {
                      val p = parts(s)
                      if (!masked || p.size < 2) return p.joinToString(" ")
                      val f = p.first(); val l = p.last()
                      return buildString {
                          append(f.first())
                          append("•".repeat((f.length - 1).coerceAtLeast(1)))
                          append(" l ")
                          append(l.first())
                          if (l.length > 2) append("•".repeat(l.length - 2))
                          if (l.length > 1) append(l.last())
                      }
                  }

                  fun maskPicpay(s: String, masked: Boolean): String {
                      val p = parts(s)
                      if (!masked || p.size < 2) return p.joinToString(" ")
                      return p.first() + " " + p.last().first() + "."
                  }

                  fun brl(cents: Long): String =
                      NumberFormat.getCurrencyInstance(Locale("pt", "BR"))
                          .format(cents / 100.0)
                          .replace("R$", "")
                          .replace('\u00A0', ' ')
                          .trim()

                  val NOMES = listOf(
                      "Gabriel Silva", "Ana Souza", "Lucas Oliveira", "Mariana Costa",
                      "Rafael Almeida", "Juliana Ferreira", "Bruno Santos", "Camila Rocha",
                      "Thiago Pereira", "Larissa Mendes", "Diego Martins", "Patrícia Lima",
                      "Vinícius Barros", "Fernanda Dias", "Marcos Ribeiro", "Bianca Freitas"
                  )
              }
          }
          EOF

          cat > app/src/main/java/br/com/pixbanner/BankArt.kt <<'EOF'
          package br.com.pixbanner

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.text.TextPaint

          object BankArt {
              fun largeIcon(bank: Bank, size: Int = 256): Bitmap {
                  val bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = bank.color }
                  val r = if (bank == Bank.NUBANK) size * 0.23f else size / 2f
                  c.drawRoundRect(RectF(0f, 0f, size.toFloat(), size.toFloat()), r, r, bg)
                  val glyph = when (bank) {
                      Bank.NUBANK -> "nu" to 0.54f
                      Bank.INTER -> "inter" to 0.245f
                      Bank.PICPAY -> "p" to 0.60f
                  }
                  val tp = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = Color.WHITE
                      typeface = Typeface.create("sans-serif", Typeface.BOLD)
                      textAlign = Paint.Align.CENTER
                      textSize = size * glyph.second
                      letterSpacing = -0.055f
                  }
                  val fm = tp.fontMetrics
                  c.drawText(glyph.first, size / 2f, size / 2f - (fm.ascent + fm.descent) / 2f, tp)
                  return bmp
              }
          }
          EOF

          cat > app/src/main/java/br/com/pixbanner/Notifier.kt <<'EOF'
          package br.com.pixbanner

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationCompat
          import androidx.core.content.pm.ShortcutInfoCompat
          import androidx.core.content.pm.ShortcutManagerCompat
          import androidx.core.graphics.drawable.IconCompat

          object Notifier {
              fun ensureChannels(ctx: Context) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  Bank.entries.forEach { b ->
                      val ch = NotificationChannel(b.channelId, b.channelName, NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "Avisos de Pix recebido"
                          enableLights(true)
                          lightColor = b.color
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 110, 80, 110)
                          setShowBadge(true)
                          lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                      }
                      nm.createNotificationChannel(ch)
                  }
              }

              private fun shortcutId(ctx: Context, bank: Bank): String? = runCatching {
                  val id = "bank_${bank.key}"
                  val sc = ShortcutInfoCompat.Builder(ctx, id)
                      .setShortLabel(bank.label)
                      .setLongLabel(bank.label)
                      .setIcon(IconCompat.createWithBitmap(BankArt.largeIcon(bank, 192)))
                      .setIntent(Intent(ctx, MainActivity::class.java).setAction(Intent.ACTION_VIEW))
                      .build()
                  ShortcutManagerCompat.pushDynamicShortcut(ctx, sc)
                  id
              }.getOrNull()

              fun show(ctx: Context, bank: Bank, amount: String, sender: String, masked: Boolean) {
                  val nm = ctx.getSystemService(NotificationManager::class.java)
                  ensureChannels(ctx)
                  val text = bank.body(amount, sender, masked)
                  val open = PendingIntent.getActivity(
                      ctx, 0,
                      Intent(ctx, MainActivity::class.java).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = NotificationCompat.Builder(ctx, bank.channelId)
                      .setSmallIcon(bank.smallIcon)
                      .setLargeIcon(BankArt.largeIcon(bank))
                      .setColor(bank.color)
                      .setContentTitle(bank.title)
                      .setContentText(text)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(text))
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setDefaults(NotificationCompat.DEFAULT_ALL)
                      .setAutoCancel(true)
                      .setShowWhen(true)
                      .setWhen(System.currentTimeMillis())
                      .setContentIntent(open)
                      .apply { shortcutId(ctx, bank)?.let { setShortcutId(it) } }
                      .build()
                  nm.notify(bank.ordinal + 1000, n)
              }
          }
          EOF

          cat > app/src/main/java/br/com/pixbanner/AlarmReceiver.kt <<'EOF'
          package br.com.pixbanner

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class AlarmReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val bank = Bank.of(intent.getStringExtra(EXTRA_BANK))
                  val amount = intent.getStringExtra(EXTRA_AMOUNT) ?: "0,00"
                  val sender = intent.getStringExtra(EXTRA_SENDER) ?: "Cliente"
                  val masked = intent.getBooleanExtra(EXTRA_MASKED, true)
                  Notifier.show(ctx, bank, amount, sender, masked)
              }

              companion object {
                  const val EXTRA_BANK = "bank"
                  const val EXTRA_AMOUNT = "amount"
                  const val EXTRA_SENDER = "sender"
                  const val EXTRA_MASKED = "masked"
              }
          }
          EOF

